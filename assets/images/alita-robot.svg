<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" fill="#FEEDD2"/>
  <!-- Grid dots -->
  <defs>
    <pattern id="grid-bot" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#121316" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#grid-bot)"/>
  
  <g transform="translate(60, 40)">
    <!-- Shadow -->
    <rect x="8" y="8" width="480" height="270" rx="12" fill="#121316"/>
    <!-- Window Body -->
    <rect x="0" y="0" width="480" height="270" rx="12" fill="#FFFFFF" stroke="#121316" stroke-width="3"/>
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="480" height="42" rx="12" fill="#FFE816" stroke="#121316" stroke-width="3"/>
    <rect x="0" y="30" width="480" height="12" fill="#FFE816"/>
    <line x1="0" y1="42" x2="480" y2="42" stroke="#121316" stroke-width="3"/>
    
    <!-- Window Buttons -->
    <circle cx="22" cy="21" r="5" fill="#FF5F56" stroke="#121316" stroke-width="1.5"/>
    <circle cx="38" cy="21" r="5" fill="#FFBD2E" stroke="#121316" stroke-width="1.5"/>
    <circle cx="54" cy="21" r="5" fill="#27C93F" stroke="#121316" stroke-width="1.5"/>
    <text x="240" y="26" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" text-anchor="middle" fill="#121316">ALITA_ROBOT — CHAT &amp; SECURITY GUARDIAN</text>

    <!-- Bot Dashboard -->
    <rect x="25" y="60" width="200" height="185" rx="8" fill="#121316" stroke="#121316" stroke-width="2"/>
    <text x="40" y="90" font-family="'Space Mono', monospace" font-size="11" fill="#97F8B7">🛡️ SHIELD: ONLINE</text>
    <text x="40" y="115" font-family="'Space Mono', monospace" font-size="10" fill="#E5E7EB">Spam Blocked: 9,420</text>
    <text x="40" y="135" font-family="'Space Mono', monospace" font-size="10" fill="#E5E7EB">Raids Defended: 142</text>
    <text x="40" y="155" font-family="'Space Mono', monospace" font-size="10" fill="#E5E7EB">Avg Latency: 12ms</text>
    <rect x="40" y="180" width="160" height="24" rx="4" fill="#C3FF16" stroke="#121316" stroke-width="1.5"/>
    <text x="120" y="196" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">PYROGRAM ASYNC</text>

    <rect x="245" y="60" width="210" height="185" rx="8" fill="#FAF9F5" stroke="#121316" stroke-width="2"/>
    <text x="260" y="86" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">⚡ High-Speed Moderation</text>
    <text x="260" y="110" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#4B5563">Enterprise group filtering,</text>
    <text x="260" y="125" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#4B5563">anti-flood protection,</text>
    <text x="260" y="140" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#4B5563">and role enforcement.</text>
    <rect x="260" y="170" width="180" height="40" rx="6" fill="#C7AEE8" stroke="#121316" stroke-width="1.5"/>
    <text x="350" y="195" font-family="'Space Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">🔒 CYBER SEC &amp; MTPROTO</text>
  </g>
</svg>
